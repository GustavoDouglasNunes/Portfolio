<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - Gustavo</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.6s ease forwards;
    }
  </style>
</head>

<body class="min-h-screen flex justify-center items-center px-4 bg-slate-900 font-sans" style="background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 58, 138, 0.8)), url('assets/Blue_particle_tech_abstract_art_background_2880x1800.jpg'); background-size: cover; background-position: center;">

  <!-- CONTAINER DO CARD (Responsivo) -->
  <div class="w-full max-w-[380px] md:max-w-[850px] flex flex-col md:flex-row bg-white/10 backdrop-blur-md rounded-[24px] shadow-2xl border border-white/20 overflow-hidden animate-fade-in">

    <!-- PAINEL ESQUERDO (Apenas Desktop) -->
    <div class="hidden md:flex md:w-1/2 flex-col justify-center items-center p-10 bg-gradient-to-br from-[#1877f2]/20 to-[#00c6ff]/20 border-r border-white/10 text-center">
      <h1 class="text-4xl font-bold text-white mb-4">Bem-vindo!</h1>
      <p class="text-gray-300 text-lg">
        Acesse meu Portfólio.
      </p>
      <div class="mt-8 w-24 h-1 bg-gradient-to-r from-[#1877f2] to-[#00c6ff] rounded-full"></div>
    </div>

    <!-- PAINEL DIREITO (Formulário) -->
    <div class="w-full md:w-1/2 p-7 md:p-10">

      <div class="text-center mb-6">
        <img src="assets/1772426236844.jpeg" alt="Foto de Perfil" class="w-[90px] h-[90px] object-cover border-3 border-[#00c6ff] rounded-full shadow-lg mb-3 mx-auto transition-transform duration-300 hover:scale-105">

        <p class="text-gray-300 text-sm mb-4">Digite seu e-mail e senha para acessar.</p>

        <h2 class="bg-gradient-to-r from-[#1877f2] to-[#00c6ff] text-white text-xl font-bold py-3 px-4 rounded-[20px] shadow-md">
          Acesso ao Perfil
        </h2>
      </div>

      <form id="loginForm">
        <!-- EMAIL -->
        <div class="mb-4 text-left">
          <label class="block text-white text-sm font-semibold mb-1">E-mail</label>
          <input type="email" id="email" placeholder="E-mail invente com @" class="w-full bg-white/10 border border-white/30 text-white rounded-xl py-2.5 px-4 focus:outline-none focus:ring-2 focus:ring-[#00c6ff] transition-all placeholder-gray-400" required>
        </div>

        <!-- SENHA -->
        <div class="mb-4 text-left">
          <label class="block text-white text-sm font-semibold mb-1">Senha</label>
          <div class="relative">
            <input type="password" id="senha" placeholder="Senha Exemplo:12345678" class="w-full bg-white/10 border border-white/30 text-white rounded-xl py-2.5 pl-4 pr-24 focus:outline-none focus:ring-2 focus:ring-[#00c6ff] transition-all" required>
            <button type="button" id="btnSenha" class="absolute right-2 top-1/2 -translate-y-1/2 bg-gradient-to-r from-[#1877f2] to-[#00c6ff] text-white text-xs font-semibold py-1.5 px-3 rounded-lg hover:opacity-90 active:scale-95 transition-all shadow">
              Mostrar
            </button>
          </div>
        </div>

        <!-- TERMOS -->
        <div class="flex items-center gap-2 mb-6">
          <input type="checkbox" id="termos" class="w-4 h-4 rounded border-white/30 bg-white/20 text-[#1877f2] focus:ring-[#00c6ff] cursor-pointer" required>
          <label for="termos" class="text-white text-xs md:text-sm select-none cursor-pointer">Aceito os termos e condições</label>
        </div>

        <!-- BOTÕES -->
        <div class="flex flex-col items-center gap-3">
          <button type="submit" class="w-full bg-gradient-to-r from-[#1877f2] to-[#00c6ff] text-white py-3 rounded-xl font-bold shadow-md hover:brightness-110 hover:scale-[1.02] active:scale-95 transition-all">
            Login
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Vinculação correta e unificada do arquivo de script externo corrigido -->
  <script src="script.js"></script>

</body>

</html>
